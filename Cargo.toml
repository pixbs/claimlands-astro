[workspace]
members = ["apps/game", "crates/world", "crates/visuals", "crates/renderer", "tools/xtask"]
default-members = ["crates/world", "crates/visuals", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/pixbs/claimlands-astro"
publish = false

[workspace.dependencies]
claimlands-world = { path = "crates/world" }
claimlands-visuals = { path = "crates/visuals" }
claimlands-renderer = { path = "crates/renderer" }
serde = { version = "=1.0.228", features = ["derive"] }
ron = "=0.12.2"
thiserror = "=2.0.18"
blake3 = "=1.8.3"
libm = "=0.2.16"
proptest = "=1.11.0"
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "=1.25.0", features = ["derive"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", default-features = false }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
wasm-bindgen-test = "=0.3.78"
web-sys = "=0.3.105"
js-sys = "=0.3.105"
pollster = "=0.4.0"
serde_json = "=1.0.149"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.package.claimlands-game]
opt-level = "s"
