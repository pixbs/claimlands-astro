name: Foundation validation
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# This workflow is evaluated from trusted main for PRs. Submitted code runs only
# in read-only jobs without deployment credentials or persistent checkout auth.
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  TRUSTED_SHA: ${{ github.workflow_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  CARGO_TERM_COLOR: always

jobs:
  policy:
    # The first commit installs governance before the game PR exists.
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read, statuses: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ env.TRUSTED_SHA }}', persist-credentials: false }
      - run: python tools/ci_status.py start
        env: { GH_TOKEN: '${{ github.token }}' }

  native:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.HEAD_SHA }}', fetch-depth: 0, persist-credentials: false }
      - name: Preserve the trusted validators
        run: |
          git archive "$TRUSTED_SHA" tools .cargo/config.toml .config/nextest.toml deny.toml | tar -x -C "$RUNNER_TEMP"
          cp -R "$RUNNER_TEMP/tools/xtask/." tools/xtask/
          cp "$RUNNER_TEMP/deny.toml" deny.toml
          cp "$RUNNER_TEMP/.cargo/config.toml" .cargo/config.toml
          cp "$RUNNER_TEMP/.config/nextest.toml" .config/nextest.toml
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-nextest@0.9.143,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: python -m pip install diff-cover==9.7.1
      - run: cargo fmt --all --check
      - run: cargo xtask boundaries
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p claimlands-game --target wasm32-unknown-unknown -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env: { RUSTDOCFLAGS: '-D warnings' }
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python -m unittest discover -s platform/tests -v
      - run: cargo nextest run --locked --workspace --profile ci
      - run: python "$RUNNER_TEMP/tools/verify_reports.py" junit target/nextest/ci/junit.xml
      - run: cargo test --locked --workspace --doc
      - name: Per-library and changed-line coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked -p claimlands-world --lib --tests --fail-under-lines 90 --lcov --output-path coverage/world.info
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked -p claimlands-visuals --lib --tests --ignore-filename-regex 'crates/world/' --fail-under-lines 90 --lcov --output-path coverage/visuals.info
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git hash-object -t tree /dev/null); fi
          diff-cover coverage/world.info coverage/visuals.info --compare-branch "$base" --diff-range-notation '..' --include 'crates/world/src/*' 'crates/visuals/src/*' --fail-under 90 --html-report coverage/changed.html
      - run: cargo deny --locked check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ env.HEAD_SHA }}
          path: |
            coverage/
            target/nextest/ci/junit.xml
          if-no-files-found: error

  browser:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.HEAD_SHA }}', fetch-depth: 0, persist-credentials: false }
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6
        with: { tool: 'wasm-bindgen-cli@0.2.128,cargo-about@0.9.2' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0' }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: chrome
        with: { chrome-version: '152.0.7977.82', install-chromedriver: true }
      - name: Native-Wasm shared contracts
        run: |
          test -x "$CHROMEDRIVER"
          python -c 'import json,os; open("webdriver.json","w").write(json.dumps({"goog:chromeOptions":{"binary":os.environ["CHROME"],"args":["--no-sandbox"]}}))'
          WASM_BINDGEN_USE_BROWSER=1 WASM_BINDGEN_TEST_TIMEOUT=120 cargo test --locked -p claimlands-world --target wasm32-unknown-unknown --test contracts -- --nocapture | tee wasm-contracts.log
          python -c 'import re; s=open("wasm-contracts.log").read(); m=re.search(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored",s); assert m and int(m[1])>=8 and int(m[2])==0 and int(m[3])==0, "missing or incomplete browser test discovery"'
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: cargo xtask web
        env: { CLAIMLANDS_REVISION: '${{ env.HEAD_SHA }}' }
      - name: Compare with trusted visual references
        run: |
          mkdir -p "$RUNNER_TEMP/references"
          git archive "$TRUSTED_SHA" tests/browser tests/baselines playwright.config.ts | tar -x -C "$RUNNER_TEMP/references"
          cp -R "$RUNNER_TEMP/references/tests/baselines/." tests/baselines/
          cp -R "$RUNNER_TEMP/references/tests/browser/." tests/browser/
          cp "$RUNNER_TEMP/references/playwright.config.ts" playwright.config.ts
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
          xvfb-run -a npx playwright test --grep deployed
        env: { CI: 'true', EXPECTED_REVISION: '${{ env.HEAD_SHA }}', CLAIMLANDS_HEADED: '1', DEBUG: 'pw:browser' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'game-${{ env.HEAD_SHA }}', path: dist/, if-no-files-found: error }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ env.HEAD_SHA }}
          path: |
            playwright-report/
            test-results/
            wasm-contracts.log
          if-no-files-found: error

  visual:
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.TRUSTED_SHA }}', persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'game-${{ env.HEAD_SHA }}', path: dist }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0' }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test visual.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: 'visual-evidence-${{ env.HEAD_SHA }}', path: test-results/, if-no-files-found: error }

  mutations:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.HEAD_SHA }}', fetch-depth: 0, persist-credentials: false }
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6
        with: { tool: 'cargo-mutants@27.1.0' }
      - name: Mutate changed core behavior
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git hash-object -t tree /dev/null); fi
          git diff "$base" "$HEAD_SHA" -- crates/world/src crates/visuals/src > changed.diff
          git archive "$TRUSTED_SHA" tools | tar -x -C "$RUNNER_TEMP"
          python "$RUNNER_TEMP/tools/run_mutations.py" changed.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: 'mutation-evidence-${{ env.HEAD_SHA }}', path: mutants.out/, if-no-files-found: error }

  android:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLAIMLANDS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.HEAD_SHA }}', persist-credentials: false }
      - run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6
        with: { tool: 'cargo-ndk@4.1.2' }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install and verify the pinned Android SDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          test -n "$ANDROID_HOME"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          grep -F 'Pkg.Revision = 27.2.12479018' "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  platform/android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - run: bash platform/android/build.sh debug
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash platform/android/smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-${{ env.HEAD_SHA }}
          path: |
            platform/android/app/build/outputs/
            test-results/android/
          if-no-files-found: error

  ios:
    needs: policy
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CLAIMLANDS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.HEAD_SHA }}', persist-credentials: false }
      - run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Verify Xcode and simulator architecture
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '18.5'
          case "$(uname -m)" in
            arm64|x86_64) ;;
            *) echo 'Unsupported macOS runner architecture' >&2; exit 1 ;;
          esac
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -Fx 'Version: 2.45.4'
          lipo "$RUNNER_TEMP/xcodegen/bin/xcodegen" -verify_arch "$(uname -m)"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: bash platform/ios/build.sh simulator
      - run: bash platform/ios/build.sh device
      - name: Run simulator lifecycle suite
        run: |
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          udid=$(xcrun simctl create 'Claim Lands CI' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          echo "CLAIMLANDS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" --arch="$(uname -m)"
          xcrun simctl bootstatus "$udid" -b
          bash platform/ios/smoke.sh "$udid"
      - name: Stop the owned simulator
        if: always() && env.CLAIMLANDS_SIMULATOR_UDID != ''
        run: xcrun simctl shutdown "$CLAIMLANDS_SIMULATOR_UDID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-${{ env.HEAD_SHA }}
          path: |
            platform/ios/DerivedData/simulator/Build/Products/
            platform/ios/DerivedData/device/Build/Products/
            test-results/ios/
          if-no-files-found: error

  deploy:
    if: ${{ always() && needs.policy.result == 'success' && needs.browser.result == 'success' && (github.event_name == 'pull_request_target' || (needs.native.result == 'success' && needs.mutations.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' && needs.visual.result == 'success')) }}
    needs: [policy, native, browser, mutations, android, ios, visual]
    runs-on: ubuntu-24.04
    environment: game-preview
    permissions: { contents: read, actions: read, deployments: write }
    outputs: { url: '${{ steps.publish.outputs.url }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.TRUSTED_SHA }}', persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: 'game-${{ env.HEAD_SHA }}', path: deployed-artifact }
      - run: python tools/check_artifact.py deployed-artifact
      - run: test "$(cat deployed-artifact/revision.txt)" = "$HEAD_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0' }
      - run: npm ci --ignore-scripts
      - name: Upload static assets only
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          branch=main
          if [[ -n "$PR_NUMBER" ]]; then branch="pr-$PR_NUMBER"; fi
          npx wrangler pages deploy deployed-artifact --project-name claimlands-astro --branch "$branch" --commit-hash "$HEAD_SHA" --commit-message 'Game build' | tee deployment.log
          python tools/deployment_url.py deployment.log "$GITHUB_OUTPUT"

  preview:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.TRUSTED_SHA }}', persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0' }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
          xvfb-run -a npx playwright test --grep deployed
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          EXPECTED_REVISION: ${{ env.HEAD_SHA }}
          CLAIMLANDS_HEADED: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: 'preview-evidence-${{ env.HEAD_SHA }}', path: playwright-report/, if-no-files-found: error }

  gate:
    if: always() && needs.policy.result != 'skipped'
    needs: [policy, native, browser, mutations, android, ios, visual, deploy, preview]
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read, statuses: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ env.TRUSTED_SHA }}', persist-credentials: false }
      - run: python tools/ci_status.py finish
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-manifest-${{ env.HEAD_SHA }}
          path: validation-manifest.json
          if-no-files-found: error
          overwrite: true
