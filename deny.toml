[graph]
targets = ["wasm32-unknown-unknown", "aarch64-linux-android", "x86_64-linux-android", "aarch64-apple-ios", "aarch64-apple-ios-sim"]
all-features = false

[advisories]
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "CC-BY-NC-SA-4.0", "OFL-1.1", "Ubuntu-font-1.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Local workspace edges are fixed by this checkout and never resolved by registry version.
allow-wildcard-paths = true
deny = [{ name = "three" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
