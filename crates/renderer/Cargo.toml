[package]
name = "claimlands-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(any(target_arch = "wasm32", target_os = "android", target_os = "ios"))'.dependencies]
claimlands-visuals.workspace = true
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[lints]
workspace = true
